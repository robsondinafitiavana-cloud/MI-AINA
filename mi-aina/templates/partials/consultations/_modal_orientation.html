<div class="modal-wrap" id="oriModal" hidden>
  <div class="modal">
    <div class="modal-head"><b>Décision d'orientation</b>
      <button data-close aria-label="Fermer"><i data-lucide="x"></i></button></div>
    <form class="modal-body" id="oriForm" data-consult="">
      <p style="font-size:12.5px;color:var(--ink-50);margin-bottom:14px" id="oriFor"></p>
      <div class="f-group" style="margin-bottom:14px">
        <div class="radio-row" id="oriChoice" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button type="button" class="radio-opt on" data-dest="CSB"
            style="border:1px solid var(--line-strong);border-radius:10px;padding:13px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;background:var(--field)">
            <i data-lucide="building-2"></i>Vers CSB</button>
          <button type="button" class="radio-opt" data-dest="HÔPITAL"
            style="border:1px solid var(--line-strong);border-radius:10px;padding:13px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;background:var(--field)">
            <i data-lucide="hospital"></i>Vers Hôpital</button>
        </div>
      </div>
      <div class="f-group">
        <label for="oriStruct">Établissement de référence</label>
        <select id="oriStruct">
          <option>CHU Befelatanana</option>
          <option>CHU HJRA Ampasanimalo</option>
          <option>CHR district le plus proche</option>
          <option>CSB de rattachement du patient</option>
        </select>
      </div>
      <div class="f-group" style="margin-bottom:2px">
        <label for="oriNote">Note de transfert</label>
        <textarea id="oriNote" placeholder="Motif de l'orientation, état du patient, traitement déjà administré…"></textarea>
      </div>
      <div class="modal-foot" style="margin:18px -20px -20px">
        <button type="button" class="btn ghost" data-close>Annuler</button>
        <button type="submit" class="btn role" style="background:var(--role);color:#fff;filter:brightness(1.1)">
          <i data-lucide="send"></i>Notifier l'agent &amp; l'établissement</button>
      </div>
    </form>
  </div>
</div>

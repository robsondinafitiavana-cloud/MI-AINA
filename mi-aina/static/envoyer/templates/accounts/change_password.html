{% load static %}
<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MI-AINA · Mot de passe</title>
<link rel="icon" type="image/png" href="{% static 'img/logo.png' %}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:radial-gradient(ellipse at 78% 12%,rgba(0,126,58,.1),transparent 34%),#F4F1E9;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;color:#1E2A22}
.b{background:#FCFBF5;border:1px solid rgba(30,42,34,.15);border-radius:20px;padding:clamp(24px,5vw,40px);width:min(460px,92vw);box-shadow:0 24px 65px rgba(30,42,34,.12)}
h2{font-family:Montserrat,sans-serif;font-weight:700;font-size:24px;letter-spacing:-.5px}
input{width:100%;height:48px;padding:0 13px;margin:8px 0 12px;border:1px solid rgba(30,42,34,.25);border-radius:10px;box-sizing:border-box;font:14px Inter,sans-serif}
button{width:100%;padding:14px;background:#007E3A;color:#fff;border:none;border-radius:10px;font:600 14px Inter,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(0,126,58,.18)}
p{color:#C1272D;font-size:13px}</style></head>
<body><form method="post" class="b">{% csrf_token %}
<img src="{% static 'img/logo.png' %}" alt="Logo MI-AINA" style="width:84px;height:84px;object-fit:contain;margin-bottom:14px">
<h2>Définis ton mot de passe</h2>
{% if messages %}{% for m in messages %}<p>{{ m }}</p>{% endfor %}{% endif %}
<input type="password" name="mdp1" placeholder="Nouveau mot de passe (8 min.)" required>
<input type="password" name="mdp2" placeholder="Confirmation" required>
<button>Valider et entrer</button></form></body></html>
